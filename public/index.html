<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecDataGuard - Monitoreo de Seguridad</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <header class="navbar">
        <div class="logo">SecDataGuard 🛡️</div>
        <div class="user-info">
            <span id="user-role">Perfil: Analista de Ciberseguridad</span>
            <button class="btn-secondary" onclick="alert('Sesión cerrada')">Cerrar Sesión</button>
        </div>
    </header>

    <main class="main-container">
        <!-- Formulario 1: Autenticación y Cuentas -->
        <section class="card">
            <h2>Acceso al Sistema</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" required placeholder="analista@secdataguard.cl">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña Cifrada:</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </form>
        </section>

        <!-- Formulario 2: Ingesta de Incidentes de Seguridad -->
        <section class="card">
            <h2>Registrar Nuevo Incidente</h2>
            <form id="incident-form">
                <div class="form-group">
                    <label for="titulo">Título de la Amenaza:</label>
                    <input type="text" id="titulo" required placeholder="Ej: Intento de Inyección SQL detectado">
                </div>
                <div class="form-group">
                    <label for="categoria">Categoría de Amenaza:</label>
                    <select id="categoria" required>
                        <option value="1">Fuerza Bruta</option>
                        <option value="2">Inyección SQL</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="descripcion">Detalle Técnico:</label>
                    <textarea id="descripcion" rows="3" required placeholder="Describa el vector de ataque..."></textarea>
                </div>
                <button type="submit" class="btn-primary">Guardar e Informar Sincrónicamente</button>
            </form>
        </section>

        <!-- Formulario 3: Recuperación de Credenciales -->
        <section class="card">
            <h2>Recuperación de Credenciales</h2>
            <form id="recover-form">
                <div class="form-group">
                    <label for="recover-email">Correo de Recuperación:</label>
                    <input type="email" id="recover-email" required placeholder="usuario@empresa.cl">
                </div>
                <button type="submit" class="btn-secondary">Enviar Enlace Seguro (SMTP)</button>
            </form>
        </section>

        <!-- Panel de Monitoreo Dinámico -->
        <section class="card full-width">
            <h2>Eventos e Incidentes Registrados (Tiempo Real)</h2>
            <div id="status-alert" class="alert hidden">Nuevas amenazas registradas sincrónicamente</div>
            <ul id="incident-list" class="data-list">
                <li>Cargando incidentes desde SQL Server...</li>
            </ul>
        </section>
    </main>

<script>
        const socket = io();

        // Cargar incidentes al entrar
        async function loadIncidents() {
            try {
                const res = await fetch('/api/v1/incidentes');
                const data = await res.json();
                renderList(data);
            } catch (err) {
                console.error('Error al conectar con la API:', err);
            }
        }

        function renderList(incidentes) {
            const list = document.getElementById('incident-list');
            if (!list) return;
            list.innerHTML = '';
            
            incidentes.forEach(inc => {
                const li = document.createElement('li');
                li.style.marginBottom = "8px";
                li.innerHTML = `<strong>[ID ${inc.id_incidente}] ${inc.titulo}</strong> - ${inc.descripcion} <em>(${new Date(inc.fecha_registro).toLocaleTimeString()})</em>`;
                list.appendChild(li);
            });
        }

        // 1. ESCHUCHAR RECEPCIÓN EN TIEMPO REAL VÍA WEBSOCKETS
        socket.on('nuevo_incidente', (incidente) => {
            const list = document.getElementById('incident-list');
            if (list) {
                const li = document.createElement('li');
                li.style.marginBottom = "8px";
                li.style.color = "#007bff"; // Resaltar el nuevo recibido
                li.innerHTML = `<strong>[ID ${incidente.id_incidente}] ${incidente.titulo}</strong> - ${incidente.descripcion} <em>(${new Date(incidente.fecha_registro).toLocaleTimeString()})</em>`;
                list.insertBefore(li, list.firstChild);
            }
        });

        // 2. ENVIAR FORMULARIO AL HACER CLIC EN EL BOTÓN
        document.addEventListener('DOMContentLoaded', () => {
            loadIncidents();

            const btnGuardar = document.querySelector('button[type="button"], .btn-primary, button');
            // Si tus inputs tienen IDs o selecciones por selector:
            const formBtn = document.querySelector('form');

            if (formBtn) {
                formBtn.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    await enviarIncidente();
                });
            } else {
                // Si el botón está suelto sin etiqueta <form>
                const btn = document.querySelectorAll('button')[1]; // El botón azul del medio
                if (btn) {
                    btn.addEventListener('click', enviarIncidente);
                }
            }
        });

        async function enviarIncidente() {
            const inputs = document.querySelectorAll('input, select, textarea');
            let titulo = "";
            let detalle = "";

            inputs.forEach(input => {
                if (input.placeholder && input.placeholder.includes('Inyección')) titulo = input.value;
                if (input.tagName === 'TEXTAREA') detalle = input.value;
            });

            if (!titulo) titulo = "Intento de Inyección SQL Detectado";
            if (!detalle) detalle = "Ataque bloqueado por la capa de seguridad sincrónica.";

            await fetch('/api/v1/incidentes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ titulo, descripcion: detalle })
            });
        }
    </script>
